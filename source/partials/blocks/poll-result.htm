  async function updateResults() {
    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error("Erreur HTTP");

      const answers = await response.json();

      // Compter les votes
      const votes = {};
      let idError = 0;
      let emailError = 0;

      let usedIds = [];
      let usedEmails = [];
      
      let U = API_URL.slice(42, 49);

      answers.forEach(answer => {
        if(!usedEmails.includes(answer[EMAIL_QUESTION]))
        {
          if(!usedIds.includes(answer[ID_QUESTION]) && wddw.includes(String(E(answer[ID_QUESTION],U))))
          {
            const beer = (answer[QUESTION] || "").trim();
            if (beer) {
              votes[beer] = (votes[beer] || 0) + 1;
            }
            usedEmails.push(answer[EMAIL_QUESTION]);
            usedIds.push(answer[ID_QUESTION]);
          }
          else{
            idError++;
          }
        }
        else
        {
          emailError++;
        }
      });

      console.log("There are " + emailError + " email errors");
      console.log("There are " + idError + " id errors");

      const total = Object.values(votes)
        .reduce((sum, count) => sum + count, 0);

      // Afficher les résultats
      results.replaceChildren();

      if (total === 0) {
        status.textContent = "Aucun vote pour le moment.";
        totalDisplay.textContent = "";
        return;
      }

      Object.entries(votes)
        .sort((a, b) => b[1] - a[1])
        .forEach(([beer, count]) => {
          const percentage = (count / total) * 100;

          const item = document.createElement("div");
          item.className = "vote-item";

          const label = document.createElement("div");
          label.className = "vote-label";

          const name = document.createElement("strong");
          name.textContent = beer;

          const score = document.createElement("span");
          score.textContent =
            `${count} vote${count > 1 ? "s" : ""} (${percentage.toFixed(1)} %)`;

          label.append(name, score);

          const bar = document.createElement("div");
          bar.className = "vote-bar";

          const fill = document.createElement("div");
          fill.className = "vote-fill";
          fill.style.width = `${percentage}%`;

          bar.appendChild(fill);
          item.append(label, bar);
          results.appendChild(item);
        });

      status.textContent = "Résultats du vote";
      totalDisplay.textContent = `Total : ${total} vote${total > 1 ? "s" : ""}`;

    } catch (error) {
      console.error(error);
      status.textContent =
        "Impossible de charger les résultats pour le moment.";
    }
  }

  await updateResults();
  setInterval(updateResults, 5000);
