name: Call reusable docker build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: clubcedille/cedille-workflows/.github/workflows/external-build-push-ghcr.yaml@master
    with:
      container-name: saveursdegenie.etsmtl.ca
      context: .
      file: Dockerfile
      branch: main
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}